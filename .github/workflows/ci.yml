name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd HydroFlow/Project && xcodegen generate

      - name: Build & test
        run: |
          cd HydroFlow/Project
          xcodebuild test \
            -scheme HydroFlow \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || exit 1

  ipa:
    # Builds an unsigned IPA for sideloading (see README: Sideloadly section).
    # Uses `build` (not `archive`) — archive enforces signing validation,
    # build with signing disabled does not. Packaging mimics xcodebuild's
    # archive layout (Payload/HydroFlow.app).
    name: Build unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd HydroFlow/Project && xcodegen generate

      - name: Build app for device (unsigned)
        run: |
          cd HydroFlow/Project
          set -o pipefail
          xcodebuild build \
            -project HydroFlow.xcodeproj \
            -scheme HydroFlow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP="HydroFlow/Project/build/dd/Build/Products/Release-iphoneos/HydroFlow.app"
          test -d "$APP" || { echo "App bundle not found"; ls HydroFlow/Project/build/dd/Build/Products/ ; exit 1; }
          rm -rf staging && mkdir -p staging/Payload
          cp -R "$APP" staging/Payload/
          cd staging
          zip -qry ../HydroFlow-unsigned.ipa Payload
          cd ..
          mv HydroFlow-unsigned.ipa "$GITHUB_WORKSPACE/HydroFlow-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/HydroFlow-unsigned.ipa" | head -8

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HydroFlow-unsigned-ipa
          path: HydroFlow-unsigned.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: HydroFlow/Project/build/xcodebuild.log
          retention-days: 7
