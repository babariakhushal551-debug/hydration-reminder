name: HydroFlow
options:
  bundleIdPrefix: com.hydroflow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  HydroFlow:
    type: application
    platform: iOS
    sources:
      - path: ../Sources
      - path: ../Resources
        optional: true
    info:
      path: ../Resources/Info.plist
      properties:
        CFBundleDisplayName: HydroFlow
        UILaunchScreen: {}
        NSHealthShareUsageDescription: HydroFlow reads nothing from Apple Health. We only write your logged water intake so your hydration data stays complete.
        NSHealthUpdateUsageDescription: HydroFlow saves your logged drinks to Apple Health as water intake samples.
        NSUserNotificationsUsageDescription: HydroFlow sends friendly hydration nudges during your active hours.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hydroflow.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: ../Sources/App/HydroFlow.entitlements
    dependencies:
      - target: HydroFlowWidget
        embed: true

  HydroFlowWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ../Widget/HydroFlowWidget.swift
      - path: ../Sources/Services/WidgetShared.swift
    info:
      path: ../Widget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hydroflow.app.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: ../Widget/HydroFlowWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""

  HydroFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../Tests/HydroFlowTests
    dependencies:
      - target: HydroFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hydroflow.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HydroFlow:
    build:
      targets:
        HydroFlow: all
        HydroFlowTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HydroFlowTests
