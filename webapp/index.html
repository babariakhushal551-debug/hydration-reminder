<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>HydroFlow — Web Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root{
    --azure:#007AFF; --aqua:#00C7BE; --indigo:#5856D6; --brand:#0058bc;
    --canvas:#F2F2F7; --card:#ffffff;
    --label:rgba(0,0,0,.88); --label2:rgba(60,60,67,.60); --label3:rgba(60,60,67,.30);
    --hair:rgba(60,60,67,.12); --grad:linear-gradient(135deg,#007AFF,#00C7BE);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Manrope',system-ui,-apple-system,sans-serif;background:#dfe3ea;display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--label)}
  .phone{width:100%;max-width:393px;height:100dvh;max-height:852px;background:var(--canvas);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,40,90,.25)}
  @media (min-width:430px){ .phone{border-radius:48px;border:8px solid #1c1c1e;height:852px} }
  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 28px 4px;font-size:15px;font-weight:700;flex-shrink:0}
  .statusbar .island{width:118px;height:32px;background:#000;border-radius:20px;margin:0 auto;position:absolute;left:50%;transform:translateX(-50%);top:10px}
  .screens{flex:1;position:relative;overflow:hidden}
  .screen{position:absolute;inset:0;overflow-y:auto;padding:0 16px 110px;display:none;scrollbar-width:none}
  .screen::-webkit-scrollbar{display:none}
  .screen.active{display:block;animation:fadein .25s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);border:.5px solid rgba(0,0,0,.04);margin-bottom:14px}
  .eyebrow{font-size:10px;font-weight:800;letter-spacing:.8px;color:var(--brand)}
  .h-large{font-size:28px;font-weight:800;letter-spacing:-.5px}
  .h-med{font-size:22px;font-weight:700}
  .h-sm{font-size:17px;font-weight:700}
  .body-b{font-size:15px;font-weight:700}
  .cap{font-size:11px;font-weight:500;color:var(--label2)}
  .cap-b{font-size:11px;font-weight:700}
  .tile{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .row{display:flex;align-items:center;gap:12px;padding:11px 0}
  .row + .row{border-top:.5px solid var(--hair)}
  .btn-grad{width:100%;height:52px;border:none;border-radius:26px;background:var(--grad);color:#fff;font-family:inherit;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(0,122,255,.35);cursor:pointer;transition:transform .15s}
  .btn-grad:active{transform:scale(.97)}
  .chip{padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;background:rgba(0,122,255,.06);border:.5px solid rgba(0,122,255,.16);color:var(--label2);cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--azure);color:#fff;border-color:var(--azure);font-weight:800}
  .navbar{position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-top:.5px solid var(--hair);display:flex;justify-content:space-around;padding:8px 8px 26px;z-index:50}
  .navbar button{background:none;border:none;font-family:inherit;font-size:10px;font-weight:600;color:var(--label2);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 10px;border-radius:12px}
  .navbar button .ic{font-size:22px;line-height:1}
  .navbar button.on{color:var(--azure);font-weight:800}
  .navbar button.on .ic{transform:scale(1.08)}
  .homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:rgba(0,0,0,.25);z-index:60;pointer-events:none}
  .toast{position:absolute;top:64px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:99px;padding:10px 18px;font-size:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.15);opacity:0;pointer-events:none;transition:all .3s;z-index:80;display:flex;gap:8px;align-items:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--canvas);border-radius:28px 28px 0 0;z-index:95;transform:translateY(105%);transition:transform .35s cubic-bezier(.32,.72,.28,1);display:flex;flex-direction:column;overflow:hidden}
  .phone.sheet-open .sheet-back{opacity:1;pointer-events:auto}
  .phone.sheet-open .sheet{transform:translateY(0)}
  .sheet-grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:8px auto 0}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 12px}
  .sheet-body{overflow-y:auto;padding:0 16px 20px;scrollbar-width:none}
  .sheet-body::-webkit-scrollbar{display:none}
  .confetti{position:absolute;inset:0;pointer-events:none;z-index:100}
  .heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .hm-day{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;background:rgba(0,122,255,.05);color:var(--label2)}
  .hm-day.low{background:rgba(88,86,214,.30);color:#fff}
  .hm-day.mid{background:rgba(0,199,190,.72);color:#fff}
  .hm-day.full{background:var(--aqua);color:#fff}
  .hm-day.today{outline:2px solid var(--azure);outline-offset:1px}
  .bars{display:flex;gap:8px;align-items:flex-end;height:130px;padding-top:6px}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .bar-val{font-size:10px;color:var(--label2);font-weight:600}
  .bar{width:100%;max-width:26px;border-radius:8px 8px 4px 4px;background:linear-gradient(to top,#5856D6,#a5a3f0);min-height:5px;transition:height .6s cubic-bezier(.3,1.2,.4,1)}
  .bar.met{background:linear-gradient(to top,#00C7BE,#7ff0ea)}
  .bar.today{background:linear-gradient(to top,#007AFF,#5eb2ff);box-shadow:0 0 12px rgba(0,122,255,.5);outline:2px solid #d8e2ff}
  .bar.empty{background:repeating-linear-gradient(45deg,#ececf2,#ececf2 4px,#e0e0e8 4px,#e0e0e8 8px)}
  .bar-letter{font-size:11px;font-weight:600;color:var(--label2)}
  .goal-line{position:relative;border-top:1.5px dashed rgba(0,122,255,.4);margin:6px 0 2px}
  .goal-line span{position:absolute;right:0;top:-9px;background:var(--canvas);font-size:10px;color:var(--brand);font-weight:700;padding:0 4px}
  .orb-wrap{display:flex;flex-direction:column;align-items:center;padding:14px 0 4px}
  .orb{width:216px;height:216px;border-radius:50%;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 12%,rgba(255,255,255,.95),rgba(240,248,255,.75) 45%,rgba(225,240,255,.65));box-shadow:inset 0 2px 14px rgba(255,255,255,.95),0 20px 40px -8px rgba(0,88,188,.35);border:1px solid rgba(255,255,255,.9)}
  .ring{position:absolute;inset:-14px;border-radius:50%;pointer-events:none}
  .liquid{position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(to bottom,#38bdf8,#0284c7 45%,#1d4ed8);transition:height 1s cubic-bezier(.3,1.1,.4,1)}
  .liquid::before{content:"";position:absolute;top:-10px;left:-50%;width:200%;height:20px;background:radial-gradient(ellipse at 50% 100%,transparent 40%,rgba(255,255,255,.35) 48%,transparent 56%);animation:wave 5s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(-12%)}}
  .bub{position:absolute;background:rgba(255,255,255,.75);border-radius:50%;animation:rise 4s ease-in infinite;bottom:8px}
  .bub:nth-child(1){left:32%;width:9px;height:9px}
  .bub:nth-child(2){left:58%;width:6px;height:6px;animation-delay:1.2s}
  .bub:nth-child(3){left:44%;width:5px;height:5px;animation-delay:2.1s}
  @keyframes rise{0%{transform:translateY(0) scale(.7);opacity:0}30%{opacity:.9}100%{transform:translateY(-140px) scale(1.1);opacity:0}}
  .orb-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
  .orb-num{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1;display:flex;align-items:baseline;gap:3px}
  .orb-num small{font-size:17px;font-weight:700;color:var(--label2)}
  .orb-goal{margin-top:8px;background:rgba(255,255,255,.78);backdrop-filter:blur(8px);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .orb-goal b{background:var(--azure);color:#fff;font-size:11px;border-radius:99px;padding:1px 7px}
  .vessels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .vessel{border:none;background:rgba(0,122,255,.05);border:.5px solid rgba(0,122,255,.14);border-radius:16px;padding:10px 4px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s}
  .vessel:active{transform:scale(.94)}
  .vessel .vi{width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:19px}
  .vessel b{font-size:12px;font-weight:800}
  .vessel span{font-size:10px;color:var(--label2)}
  .entry{display:flex;align-items:center;gap:12px;padding:11px 0}
  .entry + .entry{border-top:.5px solid var(--hair)}
  .toggle{position:relative;width:50px;height:30px;flex-shrink:0}
  .toggle input{opacity:0;width:0;height:0}
  .toggle i{position:absolute;inset:0;background:#e3e2e7;border-radius:30px;transition:.25s;cursor:pointer}
  .toggle i::before{content:"";position:absolute;width:26px;height:26px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.25s}
  .toggle input:checked + i{background:var(--grad)}
  .toggle input:checked + i::before{transform:translateX(20px)}
  .streak{display:inline-flex;align-items:center;gap:4px;background:rgba(0,122,255,.07);border-radius:99px;padding:3px 9px;font-size:11px;font-weight:800;color:var(--brand);margin-top:3px}
  .seg{display:flex;background:rgba(0,122,255,.07);border-radius:12px;padding:3px;margin:10px 0 14px}
  .seg button{flex:1;border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--label2);padding:8px;border-radius:9px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--brand);font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .hdr-row{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 6px}
  .stepper-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);border:.5px solid rgba(0,122,255,.25);color:var(--azure);font-size:20px;cursor:pointer;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .stepper-btn:active{transform:scale(.9)}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="statusbar">
    <span>9:41</span>
    <div class="island"></div>
    <span style="font-size:13px">📶🔋</span>
  </div>

  <div class="screens">
    <!-- TODAY -->
    <section class="screen active" id="screen-today"></section>
    <!-- ANALYTICS -->
    <section class="screen" id="screen-analytics"></section>
    <!-- HISTORY -->
    <section class="screen" id="screen-history"></section>
    <!-- SETTINGS -->
    <section class="screen" id="screen-settings"></section>
  </div>

  <nav class="navbar">
    <button data-tab="today" class="on"><span class="ic">💧</span>Today</button>
    <button data-tab="add"><span class="ic">➕</span>Add</button>
    <button data-tab="analytics"><span class="ic">📈</span>Analytics</button>
    <button data-tab="history"><span class="ic">🕘</span>History</button>
    <button data-tab="settings"><span class="ic">⚙️</span>Settings</button>
  </nav>

  <div class="toast" id="toast">✅ <span id="toast-text"></span></div>

  <!-- LOG SHEET -->
  <div class="sheet-back" id="sheet-back"></div>
  <div class="sheet" id="log-sheet">
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <button style="border:none;background:none;color:var(--brand);font-size:17px;font-weight:600;font-family:inherit;cursor:pointer" onclick="closeSheet()">Cancel</button>
      <span class="h-sm">Log Hydration</span>
      <button style="border:none;background:none;color:var(--brand);font-size:17px;font-weight:800;font-family:inherit;cursor:pointer" onclick="closeSheet()">Done</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <canvas class="confetti" id="confetti"></canvas>
  <div class="homebar"></div>
</div>
<script src="app.js"></script>
</body>
</html>
